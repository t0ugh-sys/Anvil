[project]
name = "Anvil"
version = "0.2.0"
description = "Terminal-first coding agent runtime inspired by Claude Code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Anvil Contributors" },
]
keywords = ["agent", "ai", "runtime", "coding", "llm", "claude", "gemini", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
gemini    = ["google-generativeai>=0.8.0"]
openai    = ["openai>=1.50.0"]
browser   = ["playwright>=1.40.0"]
yaml      = ["pyyaml>=6.0"]
tui       = ["textual>=0.86.2"]
chat      = ["rich>=13.0"]
all       = ["anvil[anthropic,gemini,openai,browser,yaml,tui,chat]"]
dev       = ["anvil[all]", "pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
anvil = "anvil.entrypoints.agent:main"
anvil-chat = "anvil.ui.rich_chat:main"

[project.urls]
Homepage = "https://github.com/t0ugh-sys/Anvil"
Repository = "https://github.com/t0ugh-sys/Anvil"
Issues = "https://github.com/t0ugh-sys/Anvil/issues"

# Third-party skill plugins register here so Anvil's discover_plugins() can
# find them automatically without any changes to Anvil's source code.
# Example (in your own package's pyproject.toml):
#
# [project.entry-points."anvil.skills"]
# my_skill = "my_package.skill:MySkill"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
anvil = ["py.typed"]
