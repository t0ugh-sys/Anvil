version: '3.8'

services:
  anvil:
    build: .
    image: anvil:latest
    container_name: anvil
    volumes:
      - .:/workspace
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /workspace
    command: ["--help"]

  # Example: Run with OpenAI
  anvil-openai:
    build: .
    volumes:
      - .:/workspace
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: >
      echo "inspect README then finish" |
      python -m anvil.entrypoints.agent
      --workspace .
      --provider openai_compatible
      --model gpt-4o-mini
      --base-url https://api.openai.com/v1

  # Example: Run with Anthropic
  anvil-anthropic:
    build: .
    volumes:
      - .:/workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PYTHONUNBUFFERED=1
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: >
      echo "inspect README then finish" |
      python -m anvil.entrypoints.agent
      --workspace .
      --provider anthropic
      --model claude-haiku-4-5

  # Example: Run with npm
  anvil-npm:
    build: .
    volumes:
      - .:/workspace
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: >
      echo "inspect README then finish" | node bin/anvil.js
      --workspace . --provider openai_compatible --model gpt-4o-mini
